<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Farah 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body{
    background:#ffe6f0;
    text-align:center;
    font-family:'Poppins', sans-serif;
    padding:40px;
    max-width:700px;
    margin:auto;
    overflow-x: hidden;
    }

/* Wadah utama slider foto */
.slider-container {
    position: relative;
    max-width: 250px;
    margin: 20px auto;
    touch-action: pan-y; /* biar swipe horizontal gak bentrok sama scroll vertikal */
}

/* Mengatur semua foto di dalam slider */
.slider-foto {
    display: none;
    width: 250px;
    height: 330px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 20px pink;
    cursor: pointer;
    transition: 0.3s;
    -webkit-user-drag: none;
    user-select: none;
}

/* Hanya foto dengan class 'aktif' yang akan muncul */
.slider-foto.aktif {
    display: block;
}

.slider-foto.aktif, #fotoBesar img.aktif-pop {
    display: block;
    animation: pudarHalus 0.4s ease-in-out;
}

@keyframes pudarHalus {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

/* Dot indicator */
.dot-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffb3d1;
    transition: 0.3s;
}

.dot.aktif {
    background: #ff4d88;
    transform: scale(1.3);
}

/* Petunjuk swipe kecil */
.petunjuk-swipe {
    font-size: 13px;
    color: #ff88b3;
    margin-top: 6px;
    opacity: 0.8;
}

/* Judul dan Tombol Surat */
h1, #tombol, #surat h3 {
    font-family: 'Pacifico', cursive;
    color:#ff4d88;
}

p{
    font-size:20px;
}

#surat{
    display:none;
    margin-top:20px;
    padding:20px;
    background:white;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    text-align:left;
    line-height:1.8;
    opacity:0;
    transition:1s;
}   

/* Animasi Hati */
.hati{
    position:fixed;
    top:-20px;
    font-size:25px;
    z-index: 99999;
    pointer-events:none;
    animation:
    jatuh 4s linear forwards,
    putar 2s linear infinite;
}

@keyframes jatuh{
    from{ top:-20px; }
    to{ top:100vh; }
}
@keyframes putar{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

/* Pop-up Foto Layar Penuh */
#fotoBesar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    touch-action: pan-y;
}
#fotoBesar img {
    display: none;
    width: 85%;
    max-width: 450px;
    border-radius: 15px; 
    cursor: pointer;
    -webkit-user-drag: none;
    user-select: none;
}

/* Responsif buat HP */
@media screen and (max-width: 480px) {
    body { padding: 20px; }
}
</style>

</head>
<body>
<audio id="laguLatar" src="aboutyou.mp3" loop></audio>
<h1>Hai Farah 🌻</h1>

<div class="slider-container" id="sliderContainer">
    <img class="slider-foto aktif" src="IMG-20260610-WA0002.jpg" alt="Foto kenangan 1" onclick="bukaFoto(this.src)">
    <img class="slider-foto" src="foto1.jpeg" alt="Foto kenangan 2" onclick="bukaFoto(this.src)">
    <img class="slider-foto" src="foto2.jpeg" alt="Foto kenangan 3" onclick="bukaFoto(this.src)">
    <img class="slider-foto" src="foto3.jpeg" alt="Foto kenangan 4" onclick="bukaFoto(this.src)">
    <img class="slider-foto" src="foto4.jpeg" alt="Foto kenangan 5" onclick="bukaFoto(this.src)">
</div>

<div class="dot-container" id="dotContainer"></div>
<p class="petunjuk-swipe">← geser foto →</p>

<p>Makasih ya udah hadir di hidupku ❤️</p>
<p>Semoga kita selalu diberi kebahagiaan dan cerita indah.</p>

<button id="tombol" onclick="munculSurat()" style="padding:12px 25px; font-size:18px; border:none; border-radius:15px; background:#ff6fa5; color:white; cursor:pointer;">
💌 Buka Surat
</button>

<div id="fotoBesar" onclick="tutupFoto()">
    <img src="" alt="Foto diperbesar">
</div>

<div id="surat">
<h3>Hai Farah 🌻</h3>
<p>Makasih ya udah hadir di hidupku.</p>
<p>Semoga hari-harimu selalu dipenuhi hal baik, dan semoga aku bisa jadi salah satu alasan kamu tersenyum.</p>
<p>❤️</p>
</div>

<script>
let indeksFoto = 0;
const daftarFoto = document.getElementsByClassName("slider-foto");

// Bikin dot indicator sesuai jumlah foto
function buatDot() {
    let dotContainer = document.getElementById("dotContainer");
    for (let i = 0; i < daftarFoto.length; i++) {
        let dot = document.createElement("div");
        dot.className = "dot" + (i === 0 ? " aktif" : "");
        dotContainer.appendChild(dot);
    }
}
buatDot();

function perbaruiDot() {
    let semuaDot = document.querySelectorAll(".dot");
    semuaDot.forEach(function(dot, i) {
        dot.classList.toggle("aktif", i === indeksFoto);
    });
}

function geserFoto(arah) {
    daftarFoto[indeksFoto].classList.remove("aktif");
    
    indeksFoto = indeksFoto + arah;
    
    if (indeksFoto >= daftarFoto.length) {
        indeksFoto = 0;
    }
    if (indeksFoto < 0) {
        indeksFoto = daftarFoto.length - 1;
    }
    
    daftarFoto[indeksFoto].classList.add("aktif");
    perbaruiDot();
    
    // Logika sinkronisasi: kalau foto besar lagi kebuka, ikut ganti gambarnya di dalam pop-up
    let popUp = document.getElementById("fotoBesar");
    let gambarPopUp = document.querySelector("#fotoBesar img");
    
    if (popUp.style.display === "flex") {
        gambarPopUp.classList.remove("aktif-pop");
        gambarPopUp.src = daftarFoto[indeksFoto].src;
        setTimeout(function(){
            gambarPopUp.classList.add("aktif-pop");
        }, 10);
    }
}

// ===== Fitur Swipe (touch gesture) =====
function pasangSwipe(elemen, callbackGeser) {
    let touchStartX = 0;
    let touchEndX = 0;
    const ambangBatas = 40; // jarak minimal geser (px) biar dianggap swipe

    elemen.addEventListener("touchstart", function(e) {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    elemen.addEventListener("touchend", function(e) {
        touchEndX = e.changedTouches[0].screenX;
        let jarak = touchEndX - touchStartX;
        if (Math.abs(jarak) > ambangBatas) {
            if (jarak < 0) {
                callbackGeser(1); // swipe ke kiri -> foto berikutnya
            } else {
                callbackGeser(-1); // swipe ke kanan -> foto sebelumnya
            }
        }
    }, { passive: true });
}

pasangSwipe(document.getElementById("sliderContainer"), geserFoto);
pasangSwipe(document.getElementById("fotoBesar"), geserFoto);

function munculSurat(){
    let surat = document.getElementById("surat");
    let tombol = document.getElementById("tombol");

    surat.style.display = "block";

    setTimeout(function(){
        surat.style.opacity = "1";
    },100);

    tombol.innerHTML = "❤️ Surat Sudah Dibuka";
    tombol.style.background = "#cc3366";

    setTimeout(function(){
        tombol.style.display = "none";
    },1500);

    for(let i=0;i<15;i++){
        let hati = document.createElement("div");
        hati.innerHTML = "❤️";
        hati.className = "hati";
        hati.style.left = Math.random()*100 + "vw";
        hati.style.animationDuration = (Math.random()*3 + 2) + "s";
        document.body.appendChild(hati);
        setTimeout(function() {
            hati.remove();
        }, 5000);
    }
}

function bukaFoto(jalurGambar){
    let gambarPopUp = document.querySelector("#fotoBesar img");
    gambarPopUp.src = jalurGambar;
    gambarPopUp.classList.add("aktif-pop");
    
    document.getElementById("fotoBesar").style.display = "flex";

    let audio = document.getElementById("laguLatar");
    let janji = audio.play();
    if (janji !== undefined) {
        janji.catch(function() {
            // Autoplay diblokir browser, gapapa dilanjut tanpa musik
        });
    }
}

function tutupFoto(){
    document.getElementById("fotoBesar").style.display = "none";
    document.querySelector("#fotoBesar img").classList.remove("aktif-pop");
    let audio = document.getElementById("laguLatar");
    audio.pause();
    audio.currentTime = 0;
}
</script>
</body>
</html>
